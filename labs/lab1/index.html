<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatiotemporal Eye-Tracking Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="app">
        <header class="glass-header">
            <h1>Eye-Tracking Analysis</h1>
            <p>Draw regions of interest and use a simple time window to answer the lab questions.</p>

            <div class="filter-bar">
                <div class="filter-group">
                    <label for="time-scrub">Time (s): <span id="time-scrub-val">0s</span></label>
                    <input type="range" id="time-scrub" min="0" max="300" step="1" value="0"
                        class="styled-slider">
                </div>
                <div class="filter-group">
                    <label for="time-start">Time Start (s):</label>
                    <input type="number" id="time-start" min="0" value="0" class="styled-input">
                </div>
                <div class="filter-group">
                    <label for="time-end">Time End (s):</label>
                    <input type="number" id="time-end" min="0" value="300" class="styled-input">
                </div>
                <button id="toggle-heatmap">Toggle Heatmap</button>
                <button id="clear-aoi" class="btn-danger">Clear Regions</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Top Left: Spatial View (Scatter/Heatmap/Brush) -->
            <section class="spatial-card glass-panel">
                <div class="section-header">
                    <h2>1. Spatial Analysis</h2>
                </div>
                <div id="spatial-container"></div>
            </section>

            <!-- Top Right: Transitions/Flow View -->
            <section class="flow-card glass-panel">
                <div class="section-header">
                    <h2>2. Region Transitions</h2>
                </div>
                <div id="flow-container"></div>
            </section>

            <!-- Bottom: Temporal View (Timeline and Slider) -->
            <section class="temporal-card glass-panel">
                <div class="temporal-header">
                    <h2>3. Temporal Frequency Timeline</h2>
                </div>
                <div id="timeline-container"></div>
            </section>
        </main>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
